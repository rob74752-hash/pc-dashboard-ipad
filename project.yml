name: PCDashboard
options:
  bundleIdPrefix: com.pcdashboard
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
targets:
  PCDashboard:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes: ["Info.plist"]
      - path: Core
      - path: UI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pcdashboard.ipad
        PRODUCT_NAME: PCDashboard
        INFOPLIST_FILE: App/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "2"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
schemes:
  PCDashboard:
    build:
      targets:
        PCDashboard: all
    run:
      config: Debug
    archive:
      config: Release
